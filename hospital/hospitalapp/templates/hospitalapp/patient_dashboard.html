<!DOCTYPE html>
<html>
  <head>
    <title>Patient Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
      }
      h1 {
        text-align: center;
        margin-bottom: 40px;
      }
      .menu {
        display: flex;
        flex-direction: column;
        width: 300px;
        margin: auto;
      }
      .menu a {
        text-decoration: none;
        background-color: #007bff;
        color: white;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
        transition: background 0.3s;
      }
      .menu a:hover {
        background-color: #0056b3;
      }
      .logout {
        background-color: red;
      }
    </style>
  </head>

  <body>
    <h1>Welcome to Patient Dashboard</h1>

    <div class="menu">
      <!-- Redirect to Book Appointment -->
      <a href="{% url 'book_appointment' %}">Book Appointment</a>

      <!-- Redirect to View Doctors -->
      <a href="{% url 'view_doctors' %}">View Doctors</a>

      <!-- Redirect to View Prescriptions -->
      <a href="{% url 'view_prescriptions' %}">View Prescriptions</a>

      <!-- Redirect to Patient Queries -->
      <a href="{% url 'patient_queries' %}">Patient Queries</a>

      <!-- Logout -->
      <a href="{% url 'patient_login' %}" class="logout">Logout</a>
    </div>
  </body>
</html>
