<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Management System</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f7f7f7;
        text-align: center;
        padding-top: 50px;
      }

      h1 {
        color: #2c3e50;
      }

      .container {
        display: flex;
        justify-content: center;
        gap: 50px;
        margin-top: 50px;
      }

      .card {
        background-color: #fff;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 200px;
        transition: transform 0.2s;
      }

      .card:hover {
        transform: scale(1.05);
      }

      .card a {
        display: inline-block;
        text-decoration: none;
        color: #fff;
        background-color: #3498db;
        padding: 10px 20px;
        border-radius: 5px;
        margin-top: 20px;
      }

      .card a:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Hospital Management System</h1>

    <div class="container">
      <div class="card">
        <h2>Admin</h2>
        <p>Login as Admin to manage doctors, patients, and appointments</p>
        <a href="/admin/">Login</a>
      </div>

      <div class="card">
        <h2>Doctor</h2>
        <p>Login as Doctor to view your patients and appointments</p>
        <a href="{% url 'doctor_login' %}">Login</a>
      </div>

      <div class="card">
        <h2>Patient</h2>
        <p>Login as Patient to book appointments and view history</p>
        <a href="{% url 'patient_login' %}">Login</a>
      </div>
    </div>
  </body>
</html>
