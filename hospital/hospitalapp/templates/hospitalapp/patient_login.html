<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .login-container {
        background-color: #fff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 300px;
      }

      h2 {
        text-align: center;
        color: #2c3e50;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      input[type="text"],
      input[type="date"] {
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      button {
        padding: 10px;
        margin-top: 15px;
        background-color: #3498db;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #2980b9;
      }

      .error {
        color: red;
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Patient Login</h2>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <input
          type="text"
          name="first_name"
          placeholder="First Name"
          required
        />
        <input
          type="text"
          name="phone_number"
          placeholder="Phone Number"
          required
        />
        <input
          type="date"
          name="date_of_birth"
          placeholder="Date of Birth"
          required
        />
        <input
          type="text"
          name="medical_record_number"
          placeholder="Medical Record Number"
          required
        />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
