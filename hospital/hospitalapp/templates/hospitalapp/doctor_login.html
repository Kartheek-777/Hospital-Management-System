<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Login</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0f4f7;
        margin: 0;
        padding: 0;
      }

      .login-container {
        width: 400px;
        margin: 100px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        color: #333;
      }

      label {
        font-weight: bold;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid #aaa;
      }

      .btn {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .btn:hover {
        background: #0056b3;
      }

      .error {
        color: red;
        text-align: center;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h2>Doctor Login</h2>

      {% if messages %} {% for message in messages %}
      <p class="error">{{ message }}</p>
      {% endfor %} {% endif %}

      <form method="POST">
        {% csrf_token %}
        <input
          type="number"
          name="doctor_id"
          placeholder="Doctor ID"
          required
        />
        <input
          type="text"
          name="first_name"
          placeholder="First Name"
          required
        />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
