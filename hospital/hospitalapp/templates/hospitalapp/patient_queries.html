<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Patient Queries</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f4f4;
        padding: 20px;
      }
      .container {
        width: 400px;
        background: white;
        padding: 20px;
        margin: auto;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
      textarea {
        width: 100%;
        height: 120px;
        padding: 10px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Submit Your Query</h2>

      <form method="POST">
        {% csrf_token %}

        <label>Your Query:</label>
        <textarea name="query" required></textarea>

        <br /><br />
        <button type="submit">Submit Query</button>
      </form>
    </div>
  </body>
</html>
